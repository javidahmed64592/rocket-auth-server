services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
    entrypoint:
      - /bin/sh
      - -c
      - "mkdir -p /etc/nginx/snippets && envsubst 'auth$$AUTH_COOKIE_DOMAIN' < /etc/nginx/snippets/auth.conf.template > /etc/nginx/snippets/auth.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/snippets/ssl.conf:/etc/nginx/snippets/ssl.conf:ro
      - ./nginx/snippets/auth.conf.template:/etc/nginx/snippets/auth.conf.template:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./var/www/testapp:/var/www/testapp:ro
    depends_on:
      - rocket-auth
    networks:
      - authnet
    restart: unless-stopped

  rocket-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AUTH_COOKIE_DOMAIN: ${VITE_AUTH_COOKIE_DOMAIN}
    environment:
      ROCKET_ADDRESS: ${ROCKET_ADDRESS}
      ROCKET_PORT: ${ROCKET_PORT}
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY}
      ROCKET_DATABASES: ${ROCKET_DATABASES}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
    volumes:
      - ./db:/app/db
    expose:
      - "${ROCKET_PORT}"
    networks:
      - authnet
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://localhost:${ROCKET_PORT}/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  authnet:
