services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/sites-available:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./var/www/testapp:/var/www/testapp:ro
    depends_on:
      - rocket-auth
    networks:
      - authnet
    restart: unless-stopped

  rocket-auth:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ROCKET_ADDRESS: ${ROCKET_ADDRESS}
      ROCKET_PORT: ${ROCKET_PORT}
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY}
      ROCKET_DATABASES: ${ROCKET_DATABASES}
    volumes:
      - ./db:/app/db
    expose:
      - "${ROCKET_PORT}"
    networks:
      - authnet
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://localhost:${ROCKET_PORT}/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  authnet:
