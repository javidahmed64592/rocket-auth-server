<!doctype html>
<html>
  <head>
    <title>Test App</title>
  </head>
  <body>
    <h1>You're authenticated!</h1>
    <p>
      This page is only reachable because nginx confirmed your session with the
      auth server.
    </p>
    <p><button onclick="logout()">Logout</button></p>
    <script>
      async function logout() {
        try {
          await fetch("/api/logout", {
            method: "POST",
            credentials: "include",
          });

          await new Promise((r) => setTimeout(r, 100));

          window.location.href =
            "https://auth.lab.home.arpa/login?redirect=https://testapp.lab.home.arpa/";
        } catch (error) {
          console.error("Logout failed", error);
        }
      }
    </script>
  </body>
</html>
